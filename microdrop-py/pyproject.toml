[project]
name = "microdrop-py"
version = "0.1.0"
authors = [{name = "Vigne-hub", email = "vignesh.rajesh@outlook.com"}]
requires-python = ">= 3.11"
dependencies = ["pyside6<=6.9.2,<7", "dotenv>=0.9.9,<0.10", "opencv-python-headless>=5.0.0.93,<6"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "alexsk", "vignesh229", "https://prefix.dev/microdrop-plugins"]
# glibc is declared per-platform (the `[tool.pixi.system-requirements]` table
# is deprecated). The linux entry is named `p1` to match pixi.lock, so this
# does not force a re-resolve. Windows and macOS take pixi defaults.
platforms = [
    { name = "p1", platform = "linux-aarch64", glibc = "2.31" },
    "linux-64",   # x86_64 CI runners (ubuntu-latest); the Pi is linux-aarch64
    "win-64",
    "osx-arm64",
]

[tool.pixi.pypi-dependencies]
microdrop_py = { path = ".", editable = true }

# Ship every package under src/ automatically (`sources` strips the src/
# prefix, so src/foo installs as foo). New packages are picked up without
# touching this file; only NON-package items at the src root need excluding —
# and forgetting one ships harmless extras instead of breaking installs
# (installed plugin packages import microdrop_utils,
# template_status_and_controls, peripheral_device_controller_base, ...).
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
exclude = [
    # non-package dirs at the src root
    "src/docs",
    "src/graphify-out",
    "src/logging_manual_test_output",
    "src/patches",
    "src/dropbot_status",       # __pycache__-only ghost of a deleted package
    "src/opendrop_status",      # __pycache__-only ghost of a deleted package
    # hidden entries at the src root (.github, .gitignore, .superpowers, ...)
    "src/.*",
    # loose files at the src root (would land in site-packages root)
    "src/*.md",
    "src/*.json",
    "src/*.yml",
    "src/*.py",
    "src/LICENSE",
    "src/pyinstaller.spec",
    "**/__pycache__",
]

# --- Shared Dependencies ---
# redis-server and ntfsutils are removed from here and placed in targets

[tool.pixi.dependencies]
apptools = ">=5.3.1,<6"
dramatiq = ">=2.2.0,<3"
envisage = ">=8.0.1,<9"
pyface = ">=8.0.0,<9"
pytest = ">=9.1.1,<10"
shapely = ">=2.1.2,<3"
pydantic = ">=2.13.4,<3"
traits = ">=7.1.0,<8"
traitsui = ">=8.0.0,<9"
redis-py = ">=6.4.0,<7"
apscheduler = ">=3.11.3,<4"
ipython = ">=9.16.1,<10"
tqdm = ">=4.70.0,<5"
ffmpeg = ">=8.0.1,<10"
"svg.path" = ">=7.1,<8"
plotly = ">=6.9.0,<7"
dropbot = ">=1.74.4,<2"
setuptools = ">=79.0.0,<85"
pixi-pycharm = ">=0.0.12,<0.0.13"
pygame = ">=2.6.1,<3"
paramiko = ">=5.0.0,<6"
pandas = ">=3.0.5,<4"
ruff = ">=0.16.4,<0.17"
mr-box-peripheral-board = ">=0.31.9,<0.32"
import-linter = "==2.14"

# Released plugin packages from the microdrop-plugins channel. They live in
# a feature so the `test` environment can omit them: plugin repos are tested
# from this workspace with their working copy on sys.path, and an installed
# copy of the same plugin would shadow it.
[tool.pixi.feature.plugins.dependencies]
magnet-microdrop-plugin = ">=1.2.0,<2"

# Conda run-dependencies declared by the plugin repos' own manifests
# (fluorescence: mpremote, scipy; heater: mpremote). The plugins are run and
# tested from this workspace's `test` environment with their clones on
# sys.path, so their runtime dependencies have to be present there. The
# default environment gets them from the installed plugin packages.
[tool.pixi.feature.plugin-deps.dependencies]
mpremote = ">=1.20"
scipy = ">=1.18,<2"

[tool.pixi.environments]
default = { features = ["plugins"], solve-group = "default" }
test = { features = ["plugin-deps"], solve-group = "default" }

# --- TARGET: Windows (win-64) ---
[tool.pixi.target.win-64.dependencies]
ntfsutils = ">=0.1.5,<0.2"
redis-server = ">=3.0.501,<4"

# --- TARGET: Linux (linux-aarch64) ---
[tool.pixi.target.linux-aarch64.dependencies]
redis-server = ">=8.10.1,<9"

[tool.pixi.target.linux-64.dependencies]
redis-server = ">=8.10.1,<9"

[tool.pixi.target.osx-arm64.dependencies]
redis-server = ">=8.10.1,<9"

[tool.pixi.tasks]
# One command for new clones: installs the shared git hooks (commit-message
# format, scratch-file block, syntax check) into all three repos. Idempotent.
setup-hooks = { cmd = "(cd ../.. && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit) && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit && cd heater-microdrop-plugin-py && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit && cd ../magnet-microdrop-plugin-py && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit && cd ../fluorescence-microdrop-plugin-py && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit", cwd = "src" }
opendrop-microdrop = { cmd = "python run_device_viewer_pluggable.py --device opendrop", cwd = "src/examples/" }
opendrop-microdrop-backend = { cmd = "python run_device_viewer_pluggable_backend.py --device opendrop", cwd = "src/examples/" }
opendrop-microdrop-frontend = { cmd = "python run_device_viewer_pluggable_frontend.py --device opendrop", cwd = "src/examples/" }
microdrop_launch = { cmd = "python microdrop.py" }
microdrop = { cmd = "python run_device_viewer_pluggable.py", cwd = "src/examples/" }
microdrop-frontend = { cmd = "python run_device_viewer_pluggable_frontend.py", cwd = "src/examples/" }
microdrop-backend = { cmd = "python run_device_viewer_pluggable_backend.py", cwd = "src/examples/" }
run_redis = { cmd = "python start_redis_server.py", cwd = "src/examples/" }
lint-microdrop-imports = { cmd = "lint-imports", cwd = "src" }
