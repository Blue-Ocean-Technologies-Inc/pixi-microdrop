[project]
name = "microdrop-py"
dynamic = ["version"]
authors = [{ name = "Vigne-hub", email = "vignesh.rajesh@outlook.com" }]
requires-python = ">= 3.11"
dependencies = ["pyside6>=6.8.0.2,<7", "dotenv>=0.9.9,<0.10", "opencv-python-headless>=5.0.0.93,<6"]

# Launch command for a packed install, which has no checkout to run the
# example scripts from: activate the environment, then `microdrop [--device ...]`.
[project.scripts]
microdrop = "examples.run_device_viewer_pluggable:cli"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

# The wheel is the Microdrop source, so it takes the source's version: the
# git tags of the `src` submodule (commitizen's `scm` provider there), not
# this repo's. `post-release` reads as "tag plus N commits" —
# v1.20.2 + 7 commits -> 1.20.2.post7+g<sha>; exactly on a tag -> 1.20.2.
# The fallback covers builds with no git or no submodule history.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "src", version_scheme = "post-release", fallback_version = "0.0.0" }

[tool.pixi.workspace]
channels = ["conda-forge", "alexsk", "vignesh229", "https://prefix.dev/microdrop-plugins"]
# glibc is declared per-platform (the `[tool.pixi.system-requirements]` table
# is deprecated). The linux entry is named `p1` to match pixi.lock, so this
# does not force a re-resolve. Windows and macOS take pixi defaults.
platforms = [
    { name = "p1", platform = "linux-aarch64", glibc = "2.41" },
    "linux-64", # x86_64 CI runners (ubuntu-latest); the Pi is linux-aarch64
    "win-64",
    "osx-arm64",
]

[tool.pixi.pypi-dependencies]
microdrop_py = { path = ".", editable = true }
# Windows: PyPI PySide6 >= 6.10 needs the system icuuc.dll, but conda-forge's
# icu puts a same-named, incompatible one first on the DLL search path. This
# installs a .pth that preloads the system copy at interpreter startup.
pyside6-icu-preload = { path = "../pyside6-icu-preload" }

# Ship every package under src/ automatically (`sources` strips the src/
# prefix, so src/foo installs as foo). New packages are picked up without
# touching this file; only NON-package items at the src root need excluding —
# and forgetting one ships harmless extras instead of breaking installs
# (installed plugin packages import microdrop_utils,
# template_status_and_controls, peripheral_device_controller_base, ...).
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
exclude = [
    # non-package dirs at the src root
    "src/docs",
    "src/graphify-out",
    "src/logging_manual_test_output",
    "src/patches",
    "src/dropbot_status", # __pycache__-only ghost of a deleted package
    "src/opendrop_status", # __pycache__-only ghost of a deleted package
    # hidden entries at the src root (.github, .gitignore, .superpowers, ...)
    "src/.*",
    # loose files at the src root (would land in site-packages root)
    "src/*.md",
    "src/*.json",
    "src/*.yml",
    "src/*.py",
    "src/*.toml",
    "src/*.j2",
    "src/LICENSE",
    "src/pyinstaller.spec",
    "**/__pycache__",
]

# --- Shared Dependencies ---
# redis-server and ntfsutils are removed from here and placed in targets

[tool.pixi.dependencies]
apptools = ">=5.3.1,<6"
dramatiq = ">=2.2.0,<3"
envisage = ">=8.0.1,<9"
pyface = ">=8.0.0,<9"
shapely = ">=2.1.2,<3"
pydantic = ">=2.13.4,<3"
traits = ">=7.1.0,<8"
traitsui = ">=8.0.0,<9"
redis-py = ">=6.4.0,<7"
apscheduler = ">=3.11.3,<4"
tqdm = ">=4.70.0,<5"
ffmpeg = ">=8.0.1,<10"
"svg.path" = ">=7.1,<8"
plotly = ">=6.9.0,<7"
dropbot = ">=1.74.4,<2"
setuptools = ">=79.0.0,<85"
pygame = ">=2.6.1,<3"
paramiko = ">=5.0.0,<6"
pandas = ">=3.0.5,<4"
mr-box-peripheral-board = ">=0.31.9,<0.32"

# Released plugin packages from the microdrop-plugins channel. They live in
# a feature so the `test` environment can omit them: plugin repos are tested
# from this workspace with their working copy on sys.path, and an installed
# copy of the same plugin would shadow it.
[tool.pixi.feature.plugins.dependencies]
magnet-microdrop-plugin = ">=1.2.0,<2"

# Portable DropBot stack: the driver UI package and the pyqtgraph plots it
# uses. Developer and test environments carry it (the Pi runs `default`);
# the packed `prod` environments target the classic DropBot rig and skip it.
[tool.pixi.feature.portable.dependencies]
dropbot-portable-ui = ">=1.0.0,<2"
pyqtgraph = ">=0.14.0,<0.15"

# Plugins that are developed from their clones next to `src` (the fluorescence
# and heater repos). Only the packed `prod` environments install the released
# packages: in a developer environment the installed copy would shadow the
# clone being worked on.
[tool.pixi.feature.prod-plugins.dependencies]
fluorescence-microdrop-plugin = ">=2.5.0,<3"
heater-microdrop-plugin = ">=1.10.1,<2"

# Conda run-dependencies declared by the plugin repos' own manifests
# (fluorescence: mpremote, scipy; heater: mpremote). The plugins are run and
# tested from this workspace's `default` and `test` environments with their
# clones on sys.path, so their runtime dependencies have to be present
# there. The `prod` environments get them from the installed plugin packages.
[tool.pixi.feature.plugin-deps.dependencies]
mpremote = ">=1.20"
scipy = ">=1.18,<2"

# Optional stack behind the fluorescence plugin's AI ROI detection: osam runs
# the SAM models on onnxruntime (CPU build). The plugin degrades gracefully
# without it, so it is a feature, not a base dependency. Model weights are not
# a package — osam downloads them to ~/.cache/osam on first use.
[tool.pixi.feature.ai.pypi-dependencies]
osam = ">=0.8.1,<0.9"

# Developer tooling — test runner, lint/format, import contracts, IDE glue,
# REPL. Nothing the running app imports, so the `prod` environment omits it.
[tool.pixi.feature.dev.dependencies]
pytest = ">=9.1.1,<10"
ruff = ">=0.16.4,<0.17"
import-linter = "==2.14"
pixi-pycharm = ">=0.0.12,<0.0.13"
ipython = ">=9.16.1,<10"

[tool.pixi.feature.dev.tasks]
lint-microdrop-imports = { cmd = "lint-imports", cwd = "src" }

# `default` stays the developer environment, so `pixi run ruff|pytest|...`,
# CI, and the PyCharm interpreter keep working unchanged. `prod` is the lean
# deployment environment: `pixi install -e prod`, `pixi run -e prod microdrop`.
# One solve-group keeps package versions identical across all three.
[tool.pixi.environments]
default = { features = ["plugins", "plugin-deps", "portable", "ai", "dev"], solve-group = "default" }
test = { features = ["plugin-deps", "portable", "dev"], solve-group = "default" }
prod = { features = ["plugins", "prod-plugins", "ai"], solve-group = "default" }
# prod without the AI stack (osam/onnxruntime), for the smaller hand-off build.
prod-no-ai = { features = ["plugins", "prod-plugins"], solve-group = "default" }

# --- TARGET: Windows (win-64) ---
[tool.pixi.target.win-64.dependencies]
ntfsutils = ">=0.1.5,<0.2"
redis-server = ">=3.0.501,<4"
# conda-forge defaults numpy/scipy to Intel MKL on Windows only: ~540 MB
# installed for math the app barely exercises. OpenBLAS is ~40 MB and is
# already what Linux and macOS resolve to.
libblas = { version = "*", build = "*openblas" }

# --- TARGET: Linux (linux-aarch64) ---
[tool.pixi.target.linux-aarch64.dependencies]
redis-server = ">=8.10.1,<9"

[tool.pixi.target.linux-64.dependencies]
redis-server = ">=8.10.1,<9"

[tool.pixi.target.osx-arm64.dependencies]
redis-server = ">=8.10.1,<9"

[tool.pixi.tasks]
# One command for new clones: installs the shared git hooks (commit-message
# format, scratch-file block, syntax check) into all three repos. Idempotent.
setup-hooks = { cmd = "(cd ../.. && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit) && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit && cd heater-microdrop-plugin-py && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit && cd ../magnet-microdrop-plugin-py && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit && cd ../fluorescence-microdrop-plugin-py && pixi exec --spec pre-commit -- pre-commit install --hook-type commit-msg --hook-type pre-commit", cwd = "src" }
opendrop-microdrop = { cmd = "python run_device_viewer_pluggable.py --device opendrop", cwd = "src/examples/" }
opendrop-microdrop-backend = { cmd = "python run_device_viewer_pluggable_backend.py --device opendrop", cwd = "src/examples/" }
opendrop-microdrop-frontend = { cmd = "python run_device_viewer_pluggable_frontend.py --device opendrop", cwd = "src/examples/" }
microdrop_launch = { cmd = "python microdrop.py" }
microdrop = { cmd = "python run_device_viewer_pluggable.py", cwd = "src/examples/" }
microdrop-frontend = { cmd = "python run_device_viewer_pluggable_frontend.py", cwd = "src/examples/" }
microdrop-backend = { cmd = "python run_device_viewer_pluggable_backend.py", cwd = "src/examples/" }
run_redis = { cmd = "python start_redis_server.py", cwd = "src/examples/" }
# pixi-pack only accepts wheels for PyPI dependencies, and the two path
# dependencies above (the editable workspace, the ICU preload) are source
# trees. Build them as wheels, skip the source entries, inject the wheels.
# Usage: `pixi run pack-prod win-64` -> dist/microdrop-prod-win-64.tar
build-wheels = { cmd = "rm -rf dist/wheels && pixi exec uv build --wheel -o dist/wheels . && pixi exec uv build --wheel -o dist/wheels ../pyside6-icu-preload" }
pack-prod = { cmd = "pixi exec pixi-pack --environment {{ environment }} --platform {{ platform }} --ignore-pypi-non-wheel --use-cache dist/pack-cache --inject dist/wheels/microdrop_py-*.whl --inject dist/wheels/pyside6_icu_preload-*.whl -o dist/microdrop-{{ environment }}-{{ platform }}.tar", args = ["platform", { arg = "environment", default = "prod" }], depends-on = ["build-wheels"] }
# The pack minus the firmware build toolchain (clang, git) that the DropBot
# driver chain declares as run dependencies — see tools/prune_pack.py.
# Usage: `pixi run pack-prod-slim win-64` -> dist/microdrop-prod-slim-win-64.tar
#        `pixi run pack-prod-slim win-64 prod-no-ai` for the build without AI
pack-prod-slim = { cmd = "python tools/prune_pack.py dist/microdrop-{{ environment }}-{{ platform }}.tar dist/microdrop-{{ environment }}-slim-{{ platform }}.tar", args = ["platform", { arg = "environment", default = "prod" }], depends-on = [{ task = "pack-prod", args = ["{{ platform }}", "{{ environment }}"] }] }
# The offline hand-off for a user without git: slim pack + pixi-unpack.exe +
# the install/run scripts from tools/share/ (+ the default AI model weights when the
# pack carries the AI stack), as a folder and a zip — see tools/build_share.py.
# Usage: `pixi run share-prod win-64`            -> dist/share-microdrop-<version>-win-64-AI-support.zip
#        `pixi run share-prod win-64 prod-no-ai` -> dist/share-microdrop-<version>-win-64-no-AI.zip
share-prod = { cmd = "python tools/build_share.py {{ platform }} {{ environment }}", args = ["platform", { arg = "environment", default = "prod" }], depends-on = [{ task = "pack-prod-slim", args = ["{{ platform }}", "{{ environment }}"] }] }
# Both hand-off zips in one go: `pixi run share-prod-all` (win-64 by default).
share-prod-all = { args = [{ arg = "platform", default = "win-64" }], depends-on = [{ task = "share-prod", args = ["{{ platform }}", "prod"] }, { task = "share-prod", args = ["{{ platform }}", "prod-no-ai"] }] }
# Once the zips are built the rest of dist/ (full and slim packs, wheels, the
# unzipped hand-off folders) is several GB of intermediates. Drop them, keeping
# the share-microdrop-*.zip files and the pack-cache download cache.
clean-dist = { cmd = "python tools/clean_dist.py" }
# Same pack as a self-extracting script, so the user needs no pixi-unpack
# binary. Linux/macOS only (.sh): the win-64 .ps1 embeds the ~1.2 GB archive
# as base64 text and PowerShell fails to load it ("An error occurred while
# creating the pipeline") — ship the .tar plus pixi-unpack.exe on Windows.
pack-prod-exe = { cmd = "pixi exec pixi-pack --environment {{ environment }} --platform {{ platform }} --ignore-pypi-non-wheel --use-cache dist/pack-cache --inject dist/wheels/microdrop_py-*.whl --inject dist/wheels/pyside6_icu_preload-*.whl --create-executable -o dist/microdrop-{{ environment }}-{{ platform }}", args = ["platform", { arg = "environment", default = "prod" }], depends-on = ["build-wheels"] }
