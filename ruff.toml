# Shared ruff baseline for the MicroDrop repos. Copy to <repo>/ruff.toml;
# repo-specific additions (extend-exclude, per-file-ignores,
# known-first-party) go below the copied block. Source of truth:
# https://github.com/Blue-Ocean-Technologies-Inc/microdrop-dev-hooks

line-length = 88
target-version = "py312"
src = ["."]

extend-exclude = [
    "microdrop-py/src",                              # submodule, own config
    "microdrop-py/*-microdrop-plugin-py",            # sibling plugin clones
]

[lint]
select = ["CPY001", "E", "F", "W", "I"]
# CPY001 is a preview rule; explicit-preview-rules keeps every other rule on
# stable behavior.
preview = true
explicit-preview-rules = true

[lint.flake8-copyright]
# The authoritative header text lives in AGENTS.md; this regex pins the
# owner but accepts any year range, so there is no annual churn.
notice-rgx = '\(C\) Copyright \d{4}-\d{4} Blue Ocean Technologies, Inc\., Toronto, ON'
# Empty files (bare __init__.py) need no notice.
min-file-size = 1

[lint.isort]
# AGENTS.md import order: standard -> third-party -> enthought -> other
# microdrop packages (first-party) -> microdrop_style -> microdrop_utils
# -> local relative -> logger last.
# `examples` (submodule packages) and `microdrop` (the launcher's own
# module) aren't directories at this root, so ruff can't infer they're
# first-party from the filesystem the way it does inside the submodule.
known-first-party = ["examples", "microdrop"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "enthought",
    "first-party",
    "microdrop-style",
    "microdrop-utils",
    "local-folder",
    "logger",
]

[lint.isort.sections]
enthought = ["apptools", "envisage", "pyface", "traits", "traitsui"]
"microdrop-style" = ["microdrop_style"]
"microdrop-utils" = ["microdrop_utils"]
logger = ["logger"]
