name: Release

# Every push to master is auto-released: commitizen computes the next semver
# from Conventional Commits (fix -> patch, feat -> minor, BREAKING CHANGE ->
# major), commits the CHANGELOG.md update, tags vX.Y.Z, and publishes a
# GitHub Release with the changelog increment as its notes. There is nothing
# to build: the environment ships as the git checkout the launcher pulls.
# Pushes with no releasable commits (docs/chore/ci only) skip the release.

on:
  push:
    branches: [master]

permissions:
  contents: write   # push bump commit + tag, create the release

# Queue runs so two quick pushes to master can't race the same bump.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: bump version, changelog & release
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # cz bump walks the full history and tags
          # The org release token, so the bump push and the release carry
          # the same identity as the other repos' pipelines.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Install commitizen
        run: pipx install "commitizen>=4,<5"

      - name: Bump version, update changelog, push tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          cz bump --yes --changelog --changelog-to-stdout > release_notes.md
          rc=$?
          set -e
          # 3 = no commits since last tag, 21 = commits but none releasable
          if [ "$rc" -eq 3 ] || [ "$rc" -eq 21 ]; then
            echo "No feat/fix/BREAKING commits since the last tag — nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          tag="$(git describe --tags --abbrev=0)"
          # Atomic: a mid-run merge that makes master non-fast-forward must not
          # leave the tag behind, or every later run sees an orphan tag and
          # tries to re-create it (exit 7).
          git push --atomic origin master "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.bump.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --notes-file release_notes.md
