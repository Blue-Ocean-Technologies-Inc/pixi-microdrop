[project]
name = "pyside6-icu-preload"
version = "0.1.0"
description = "Preload Windows' system ICU so PyPI PySide6 imports inside conda environments."
requires-python = ">= 3.8"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# No package directory: the wheel ships only a top-level module plus the .pth
# that imports it at interpreter startup.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"pyside6_icu_preload.py" = "pyside6_icu_preload.py"
"pyside6_icu_preload.pth" = "pyside6_icu_preload.pth"
